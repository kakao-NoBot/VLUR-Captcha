name: Backend + AI Image Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'AI/**'
      - '.github/workflows/backend-ai-images.yml'

permissions:
  contents: read

env:
  REGISTRY: kc-sfacspace05.kr-central-2.kcr.dev
  BACKEND_IMAGE_NAME: team2-repo/vlur-backend
  AI_IMAGE_NAME: team2-repo/vlur-ai

jobs:
  build-and-push:
    name: Build and push backend + ai images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to KakaoCloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.KCR_ACCESS_KEY_ID }}
          password: ${{ secrets.KCR_SECRET_ACCESS_KEY }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_VLUR_API_BASE=https://vlur.site
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Build and push ai image
        uses: docker/build-push-action@v7
        with:
          context: ./AI
          file: ./AI/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.AI_IMAGE_NAME }}:sha-${{ github.sha }}
