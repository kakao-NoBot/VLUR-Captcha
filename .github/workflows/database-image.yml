name: Database Image Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'database/**'
      - '.github/workflows/database-image.yml'

permissions:
  contents: read

env:
  REGISTRY: kc-sfacspace05.kr-central-2.kcr.dev
  IMAGE_NAME: team2-repo/vlur-database

jobs:
  build-and-push:
    name: Build and push database image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to KakaoCloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.KCR_ACCESS_KEY_ID }}
          password: ${{ secrets.KCR_SECRET_ACCESS_KEY }}

      - name: Build and push database image
        uses: docker/build-push-action@v7
        with:
          context: ./database
          file: ./database/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}