name: Embed Image Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'embed/**'
      - '.github/workflows/embed-image.yml'

permissions:
  contents: read

env:
  REGISTRY: kc-sfacspace05.kr-central-2.kcr.dev
  IMAGE_NAME: team2-repo/vlur-embed

jobs:
  build-and-push:
    name: Build and push embed image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to KakaoCloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.KCR_ACCESS_KEY_ID }}
          password: ${{ secrets.KCR_SECRET_ACCESS_KEY }}

      # 모델 가중치를 빌드 중에 내려받아 이미지에 굽기 때문에 다른 이미지보다 오래 걸린다.
      - name: Build and push embed image
        uses: docker/build-push-action@v7
        with:
          context: ./embed
          file: ./embed/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
