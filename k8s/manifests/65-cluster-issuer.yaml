# cert-manager ClusterIssuer — Let's Encrypt 프로덕션 발급자.
# cert-manager 설치(가이드 Phase 4) 후에 apply 해야 한다(CRD가 먼저 있어야 함).
# mingyu2157@naver.com 은 인증서 만료 알림을 받을 실제 이메일로 치환.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mingyu2157@naver.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
