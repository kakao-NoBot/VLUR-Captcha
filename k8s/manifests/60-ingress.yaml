# 외부 노출 — nginx Ingress Controller(L7 LB) 기준.
#   vlur.site         → frontend  (frontend nginx가 /api·/static을 백엔드로 프록시)
#   ticket.vlur.site  → ticketing-demo
# TLS는 cert-manager(65-cluster-issuer.yaml)가 Let's Encrypt HTTP-01로 자동 발급해
# vlur-site-tls Secret에 저장한다. 발급 조건: 두 도메인의 DNS A 레코드가 이 Ingress
# Controller의 EXTERNAL-IP를 가리키고 있어야 한다(가이드 Phase 4).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: captcha
  namespace: captcha
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vlur.site
        - ticket.vlur.site
      secretName: vlur-site-tls
  rules:
    - host: vlur.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: ticket.vlur.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketing-demo
                port:
                  number: 80
