# 챗봇용 자체 호스팅 LLM — vLLM(OpenAI 호환 API) Deployment + Service.
#
# 백엔드는 app-config의 CHATBOT_API_URL로 여기를 호출한다. vLLM이 OpenAI와 같은
# /v1/chat/completions 스키마를 제공하므로 backend/routers/chatbot.py의 호출 코드는
# 그대로 두고 주소만 바꿔 끼운다.
#
# 전제:
#   - GPU 노드(team2-gpu)에 Phase 3-0의 taint(workload=gpu:NoSchedule)가 걸려 있을 것
#     → 아래 tolerations가 그 taint와 짝이다. taint 키/값을 다르게 걸었다면 여기도 맞출 것.
#   - 클러스터에 NVIDIA device plugin이 있어야 nvidia.com/gpu 자원을 요청할 수 있다.
#     (가이드 Phase 11-1에서 확인·설치)
#   - csi-cinder-sc-retain 치환 필요 (모델 캐시 PVC)
---
# 모델 가중치 캐시. 이게 없으면 파드가 재시작될 때마다 HuggingFace에서 십수 GB를 다시
# 받느라 수십 분씩 걸린다. GPU 노드가 1대뿐이라 ReadWriteOnce로 충분하다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-model-cache
  namespace: captcha
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: csi-cinder-sc-retain
  resources:
    requests:
      # 3B 모델 가중치가 ~6GB. 블록 스토리지 쿼터를 아끼려고 20Gi로 잡았다
      # (mysql 20 + 백업 10 + 여기 20 = 50Gi).
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llm
  namespace: captcha
spec:
  selector:
    app: llm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: captcha
spec:
  replicas: 1              # GPU 노드가 1대 — 늘려도 스케줄되지 않는다
  strategy:
    type: Recreate         # 롤링 업데이트를 하면 새 파드가 GPU를 못 잡고 Pending에 걸린다
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      tolerations:
        - key: workload
          value: gpu
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.3
          args:
            - --model=$(MODEL_ID)
            - --served-model-name=vlur-chatbot   # 요청에 쓰는 이름을 모델 경로와 분리
            - --max-model-len=16384               # 8192로는 부족해서 다시 올림 — 시스템 프롬프트가
                                                   # [핵심 요약] 안전망 추가로 다시 커졌고(현재 ~5,100자),
                                                   # 여기에 RAG 문서 3건 + 대화가 길어지며 쌓이는 최근 10개
                                                   # 메시지(긴 답변 여러 개면 수천 자)까지 더해지면 8192
                                                   # 토큰을 넘는 경우가 생겨 "됐다가 안됐다가" 하는 502가 남.
                                                   # (T4 15GB, 3B 가중치 ~6GB로 KV 캐시 여력 충분)
            - --gpu-memory-utilization=0.90
            # T4는 Turing 세대라 bfloat16 연산 유닛이 없다. Qwen2.5의 기본 dtype이
            # bfloat16이므로 auto로 두면 실패하거나 극도로 느려진다 — float16을 명시한다.
            - --dtype=half
          env:
            - name: MODEL_ID
              # GPU가 Tesla T4(VRAM 15GB) 한 장이라 7B는 들어가지 않는다(fp16 가중치만 ~14.5GB).
              # 3B는 가중치 ~6GB + KV 캐시 ~7GB로 여유가 있다. 이 챗봇은 고정 시스템 프롬프트로
              # 서비스 FAQ만 답하는 용도라 3B로 충분하다.
              value: Qwen/Qwen2.5-3B-Instruct
            - name: HF_HOME
              value: /model-cache
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: 32Gi
            requests:
              cpu: "2"
              memory: 16Gi
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
            - name: shm
              mountPath: /dev/shm
          # 최초 기동은 모델 다운로드(수 GB) 때문에 아주 오래 걸린다 — 넉넉히 잡는다.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            failureThreshold: 120     # 최대 30분
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llm-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
