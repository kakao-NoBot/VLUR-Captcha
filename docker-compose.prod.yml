services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      additional_contexts:
        frontend: ./frontend
      args:
        VITE_VLUR_API_BASE: ${VITE_VLUR_API_BASE:-http://localhost:8000}
    container_name: captcha-backend
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai:5000}
      - AI_SERVICE_TIMEOUT_SECONDS=${AI_SERVICE_TIMEOUT_SECONDS:-3.0}
    ports:
      - "8000:8000"
    depends_on:
      ai:
        condition: service_healthy
    restart: always

  ai:
    build:
      context: ./AI
    container_name: captcha-ai
    environment:
      - MODEL_PATH=${AI_MODEL_PATH:-/app/AI/model/ensemble_checkpoint.pt}
      - MODEL_VERSION=${AI_MODEL_VERSION:-cnn-bilstm-ensemble-v1}
    expose:
      - "5000"
    restart: always
