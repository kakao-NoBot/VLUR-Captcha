name: vlur-backend-ai

services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: captcha-backend
    env_file:
      - .env
    environment:
      AI_SERVICE_URL: http://ai:5000
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-3.0}
    ports:
      - "${BACKEND_BIND_ADDRESS}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      ai:
        condition: service_healthy
    networks:
      - backend-ai-internal
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  ai:
    image: ${AI_IMAGE}
    container_name: captcha-ai
    environment:
      MODEL_PATH: ${AI_MODEL_PATH:-/app/AI/model/ensemble_checkpoint.pt}
      MODEL_VERSION: ${AI_MODEL_VERSION:-cnn-bilstm-ensemble-v1}
    expose:
      - "5000"
    networks:
      - backend-ai-internal
    restart: unless-stopped

networks:
  backend-ai-internal:
    name: vlur-backend-ai-internal
    driver: bridge
